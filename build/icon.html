<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;background:transparent;overflow:hidden;}
  .wrap{position:relative;width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;}
  .tile{
    position:absolute;left:72px;top:64px;width:880px;height:880px;border-radius:196px;
    background:linear-gradient(160deg,#ffffff 0%,#f4f5f7 46%,#e6e8ec 100%);
    box-shadow:0 26px 60px rgba(16,20,26,.22), 0 2px 0 rgba(255,255,255,.9) inset,
               0 0 0 2px rgba(16,20,26,.07) inset;
  }
  .mark{position:relative;width:472px;height:472px;color:#111318;margin-top:-6px;}
  svg{display:block;width:100%;height:100%;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="tile"></div>
    <div class="mark">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 9 H68 L88 29 V87 a4 4 0 0 1 -4 4 H23 a4 4 0 0 1 -4 -4 V13 a4 4 0 0 1 4 -4 Z"/>
        <path d="M31 24.5 v21.5"/>
        <path d="M43.5 24.5 v21.5"/>
        <path d="M56 24.5 v21.5"/>
        <rect x="27" y="63.5" width="46" height="19" rx="2"/>
      </svg>
    </div>
  </div>
</body>
</html>
